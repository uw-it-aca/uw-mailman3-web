---
name: Build, Test and Deploy

env:
  RELEASE_NAME: mailman-web
  DJANGO_APP: uwtheme

on:
  push:
    branches: [main, develop, task/deployment-matrix]
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize]

jobs:
  context:
    runs-on: ubuntu-24.04

    outputs:
      commit_hash: ${{ steps.context.outputs.commit_hash }}
      git_repo_branch: ${{ steps.context.outputs.git_repo_branch }}
      image_tag: ${{ steps.context.outputs.image_tag }}
      instance_matrix: ${{ steps.context.outputs.instance_matrix }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Context
        id: context
        uses: uw-it-aca/actions/cicd-context@16849f1d5ab74f452cffb0861cc6ae1b40f2ae3b
        with:
          release_name: ${{ env.RELEASE_NAME }}

  build:
    runs-on: ubuntu-24.04

    needs: context

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-$(echo ${{ hashFiles('Dockerfile') }} | head -c 16)
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build App Image
        uses: docker/build-push-action@v5
        with:
          target: app-container
          tags: ${{ needs.context.outputs.image_tag }}
          push: false
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Push Image to GCR
        if: github.event_name == 'push'
        uses: uw-it-aca/actions/gcr-push@main
        with:
          image_tag: ${{ needs.context.outputs.image_tag }}
          gcp_json_key: ${{ secrets.GCP_JSON_KEY }}

  deploy:
    if: github.event_name == 'push'

    needs: [context, build]

    runs-on: ubuntu-24.04

    outputs:
      context: ${{ steps.context.outputs.context }}

    strategy:
      matrix:
        instance: ${{ fromJSON(needs.context.outputs.instance_matrix) }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Dev/Test Deployment Pipeline
        if: >-
          contains(fromJSON('["develop", "task/deployment-matrix"]'),
            needs.context.outputs.git_repo_branch)
        uses: uw-it-aca/actions/cicd-deploy@16849f1d5ab74f452cffb0861cc6ae1b40f2ae3b
        with:
          release_name: ${{ env.RELEASE_NAME }}
          release_instance: ${{ matrix.instance }}
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}
          commit_hash: ${{ needs.context.outputs.commit_hash }}
          git_repo_branch: ${{ needs.context.outputs.git_repo_branch }}
          helm_chart_branch: feature/repo-identifier

      - name: Production Deployment Pipeline
        if: >-
          contains(fromJSON('["main"]'),
            needs.context.outputs.git_repo_branch)
        uses: uw-it-aca/actions/cicd-deploy@16849f1d5ab74f452cffb0861cc6ae1b40f2ae3b
        with:
          release_name: ${{ env.RELEASE_NAME }}
          release_instance: ${{ matrix.instance }}
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}
          commit_hash: ${{ needs.context.outputs.commit_hash }}
          git_repo_branch: ${{ needs.context.outputs.git_repo_branch }}
          gcp_production_project: 'uwit-mci-0016'
          gcp_production_flux_instance: 'mailman'
          flux_repo_default_branch: 'main'
          helm_chart_branch: feature/repo-identifier

      - name: 'Surface context from executed build step'
        id: context
        shell: bash
        run: echo "::set-output name=context::$(< ${CONTEXT_FILENAME})"

  housekeeping:
    if: github.event_name == 'push'

    needs: [context, build, deploy]

    runs-on: ubuntu-24.04

    steps:
      - name: House Keeping
        uses: uw-it-aca/actions/cicd-housekeeping@16849f1d5ab74f452cffb0861cc6ae1b40f2ae3b
        with:
          release_name: ${{ env.RELEASE_NAME }}-01
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}
          registry_password: ${{ secrets.GCP_JSON_KEY }}
          context: ${{ needs.deploy.outputs.context }}
          flux_instances: 'mailman,dev'
