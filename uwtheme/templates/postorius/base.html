{% extends "postorius/base.html" %}

{% block additionalcss %}
<link rel='stylesheet' href='/static/postorius/css/uw-theme.css' type='text/css' media='screen'>
{{ block.super }}
{% endblock %}


{% block additionaljs %}
<script type="text/javascript">
(function () {
    var $signon_link = $('ul.navbar-nav li.nav-item a.nav-link span.fa-sign-in').parents('li.nav-item'),
        $logo_link = $('.navbar-header a.navbar-brand'),
        $logo_span = $('span', $logo_link);

    $logo_link.attr('href', $logo_link.attr('href'){% if IS_SAML_AUTHENTICATED %} + '?is_authenticated=true'{% endif %});
    $logo_span.html($logo_span.html().replace('Postorius', 'Mailman'));
    // $postorius_link.attr('href', 'https://{{CLUSTER_WEB_HOST}}' + $postorius_link.attr('href'));

    // hide user setttings for dmarc mitigations since those are set globally
    $('li.nav-item a.nav-link[href$="/settings/dmarc_mitigations"]').parent().remove();

    if ($signon_link.length) {
        $signon_link.replaceWith(
          '<div class="btn-group">' +
              '<button type="button" role="button" class="dropdown-toggle btn" data-bs-toggle="dropdown" aria-haspopup="true" style="color: white;">' +
                '<span class="fa fa-sign-in"></span> Sign In' +
              '</button>' +
              '<ul class="dropdown-menu" role="menu">' +
                  '<li class="dropdown-item">' +
                      '<a class="dropdown-item" href="{% url LOGIN_URL %}?next={{ next|default:request.path|urlencode }}">UW Login</a>' +
                  '</li>' +
                  '<li class="dropdown-item">' +
                      '<a class="dropdown-item" href="/accounts/login/?next={{ next|default:request.path|urlencode }}">Guest Sign In</a>' +
                  '</li>' +
              '</ul>' +
          '</div>');
    }
}());
</script>
{{ block.super }}
{% endblock %}
